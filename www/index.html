<!DOCTYPE html>

<head>
  <title>WebSocket Test</title>
  <style>
    * {
      box-sizing: border-box;
    }

    table {
      border-collapse: collapse;
    }

    td {
      border: 1px solid black;
      padding: 0.5rem;
      vertical-align: top;
    }

    pre {
      margin: 0;
    }

    .two-wide {
      display: flex;
      gap: 1rem;

      > * {
        flex-basis: 0;
        flex-grow: 1;
        flex-shrink: 1;
      }
    }

    .chat {
      width: 20rem;
      margin-bottom: 1rem;
      height: 16rem;
      display: flex;
      flex-direction: column;
      border: 1px solid black;

      .log {
        flex-grow: 1;
        overflow-y: scroll;

        div {
          padding: 0.1rem 0.25rem;
        }
      }

      input {
        /* width: 100%; */
        flex-shrink: 0;
        margin: 2px;
      }
    }
  </style>
</head>

<body>
  <p>Time to test a server.</p>
  <div class="two-wide">
    <div id="one">
      <div class="chat">
        <div class="log"></div>
        <input type="text">
      </div>
      <table>
        <thead>
          <tr>
            <th>Sent</th>
            <th>Received</th>
            <th>Preview</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>
    <div id="two">
      <div class="chat">
        <div class="log"></div>
        <input type="text">
      </div>
      <table>
        <thead>
          <tr>
            <th>Sent</th>
            <th>Received</th>
            <th>Preview</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const STError = 0;
    const STEnd = 1;
    const STObject = 2;
    const STArray = 3;
    const STFloat = 4;
    const STBool = 5;
    const STString = 6;

    const ETRecord = 0x01;
    const ETSYN = 0x10;
    const ETACK = 0x11;
    const ETTyping = 0x20;
    const ETPresenceUpdate = 0x21;
    const ETAuth = 0x90;
    const ETError = 0xFE;
    const ETReserved = 0xFF;

    const RTMessage = 0;
    const RTDeleteMessage = 1;
    const RTEdit = 2;
    const RTReply = 3;
    const RTReactionAdd = 4;
    const RTReactionRemove = 5;

    function parseMessage(msg, ctx = { cur: 0 }) {
      const dv = new DataView(msg.buffer);

      const tag = dv.getUint8(ctx.cur);
      ctx.cur += 1;

      switch (tag) {
        case STObject: {
          const result = {};
          while (true) {
            const fieldTag = dv.getUint8(ctx.cur);
            if (fieldTag === STEnd) {
              ctx.cur += 1;
              break
            }
            if (fieldTag !== STString) {
              throw new Error(`expected string for field name (type ${STString}), but got type ${fieldTag}`);
            }
            const fieldName = parseMessage(msg, ctx);
            const fieldValue = parseMessage(msg, ctx);
            result[fieldName] = fieldValue;
          }
          return result;
        } break;
        case STArray: {
          const result = [];
          while (true) {
            const fieldTag = dv.getUint8(cur);
            if (fieldTag === STEnd) {
              ctx.cur += 1;
              break
            }
            result.push(parseMessage(msg, ctx));
          }
          return result;
        } break;
        case STFloat: {
          const result = dv.getFloat64(ctx.cur, true);
          ctx.cur += 8;
          return result;
        } break;
        case STBool: {
          const result = dv.getUint8(cur);
          ctx.cur += 1;
          if (result > 1) {
            throw new Error(`expected bool byte but got ${result}`);
          }
          return result !== 0;
        } break;
        case STString: {
          const length = dv.getFloat64(ctx.cur, true);
          ctx.cur += 8;
          const result = new TextDecoder().decode(msg.subarray(ctx.cur, ctx.cur + length));
          ctx.cur += length;
          return result;
        } break;
        default:
          throw new Error(`unknown value type ${tag}`);
      }
    }

    function encodeMessage(msg) {
      const bytes = [];
      function encodeRecursive(val) {
        switch (Array.isArray(val) ? "array" : typeof val) {
          case "object": {
            bytes.push(STObject);
            for (const [name, value] of Object.entries(val)) {
              encodeRecursive(name);
              encodeRecursive(value);
            }
            bytes.push(STEnd);
          } break;
          case "array": {
            bytes.push(STArray);
            for (const elem of val) {
              encodeRecursive(elem);
            }
            bytes.push(STEnd);
          } break;
          case "number": {
            bytes.push(STFloat);
            const buf = new ArrayBuffer(8);
            new DataView(buf).setFloat64(0, val, true);
            bytes.push(...new Uint8Array(buf));
          } break;
          case "string": {
            bytes.push(STString);
            const buf = new ArrayBuffer(8);
            new DataView(buf).setFloat64(0, val.length, true);
            bytes.push(...new Uint8Array(buf));
            bytes.push(...new TextEncoder().encode(val));
          } break;
          case "boolean": {
            bytes.push(STBool);
            bytes.push(val ? 1 : 0);
          } break;
          default:
            throw new Error(`cannot encode values of type ${typeof val}`);
        }
      }
      encodeRecursive(msg);
      return new Uint8Array(bytes);
    }

    async function test(container) {
      const input = container.querySelector("input");
      const log = container.querySelector(".log");

      const { promise: wsReady, resolve: resolveWsReady, reject: rejectWsReady } = Promise.withResolvers();
      const ws = new WebSocket("ws://localhost:8667/api/events");
      ws.binaryType = "arraybuffer";

      ws.addEventListener("open", () => {
        resolveWsReady();
      });
      ws.addEventListener("error", err => {
        console.error("websocket error", err);
        rejectWsReady(err);
      });

      function createLogCell(msgBytes) {
        const td = document.createElement("td");
        const pre = document.createElement("pre");
        for (let i = 0; i < msgBytes.length; i++) {
          if (i > 0 && i % 16 === 0) {
            pre.innerHTML += "\n";
          } else if (i > 0) {
            pre.innerHTML += " ";
          }
          pre.innerHTML += msgBytes[i].toString(16).padStart(2, "0");
        }
        td.appendChild(pre);
        return td;
      }
      function createHexView(msgBytes) {
        const td = document.createElement("td");
        const pre = document.createElement("pre");
        for (let r = 0; r <= Math.floor(msgBytes.length / 16); r++) {
          if (r > 0) {
            pre.innerHTML += "\n";
          }
          pre.innerHTML += "| ";
          for (let i = 0; i < 16; i++) {
            const b = msgBytes[16 * r + i];
            if (b === undefined) {
              pre.innerHTML += " ";
            } else if (0x20 <= b && b <= 0x7E) {
              pre.innerHTML += String.fromCharCode(b);
            } else {
              pre.innerHTML += ".";
            }
          }
          pre.innerHTML += " |";
        }
        td.appendChild(pre);
        return td;
      }

      let latestServerSN = -1n;
      function send(msg) {
        console.debug("Client event", msg);
        const msgBytes = encodeMessage(msg);
        const row = document.createElement("tr");
        row.appendChild(createLogCell(msgBytes));
        row.appendChild(document.createElement("td"));
        row.appendChild(createHexView(msgBytes));
        container.querySelector("tbody").appendChild(row);
        ws.send(msgBytes);
      }
      function receive(msgBytes) {
        const row = document.createElement("tr");
        row.appendChild(document.createElement("td"));
        row.appendChild(createLogCell(msgBytes));
        row.appendChild(createHexView(msgBytes));
        container.querySelector("tbody").appendChild(row);

        const event = parseMessage(msgBytes);
        console.debug("Server event", event);

        switch (event.type) {
          case ETRecord: {
            const record = event.record;

            console.log(`Latest server SN is ${record.sn} (was ${latestServerSN})`);
            latestServerSN = record.sn;
            // TODO(ben): ACK periodically while receiving normal messages, before receiving
            // a SYN

            switch (record.type) {
            case RTMessage: {
              const row = document.createElement("div");
              row.innerText = record.text;
              log.appendChild(row);
              row.scrollIntoView({ behavior: "instant", block: "end" });
            } break;
            default:
              console.error(`unknown record type ${record.type}`);
            }
          } break;

          case ETSYN: {
            send({ type: ETACK, sn: latestServerSN });
          } break;

          case ETError: {
            console.error(event.message);
          } break;

          default:
            console.error(`unknown event type ${event.type}`);
        }
      }

      ws.addEventListener("message", msg => {
        receive(new Uint8Array(msg.data));
      });

      input.addEventListener("keydown", e => {
        if (e.key === "Enter") {
          let text = input.value.trim();
          if (text.length > 0) {
            send({
              type: ETRecord,
              record: {
                type: RTMessage,
                text: text,
              },
            });
            input.value = "";
          }
        }
      });
      
      await wsReady;
      send({
        type: ETSYN,
      });
      // setTimeout(() => ws.close(1000), 2000);
    };

    test(window.one);
    setTimeout(() => test(window.two), 500);
  </script>
</body>
